<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドット絵マップやよ！</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; width: 100vw; margin: 0; }
    body { margin: 0; padding: 0; }
    /* ドット絵がボヤけないようにくっきり表示する設定やよ！ */
    .pixel-art {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 地図の初期化（北見駅周辺）
  const map = L.map('map').setView([43.8041, 143.8964], 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // さっきアップロードした chara.png を指定するやよ！
  const pixelIcon = L.icon({
    iconUrl: 'chara.png', // アップロードした画像ファイル名
    iconSize: [48, 48],   // 表示する大きさ（好みに合わせて変更してね）
    iconAnchor: [24, 24], // 画像の中心を現在地に合わせる設定
    className: 'pixel-art'
  });

  let userMarker = null;

  // GPSで現在地を取得・追跡するやよ！
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition((position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;

      if (!userMarker) {
        // 初回：ドット絵キャラを現在地に配置！
        userMarker = L.marker([lat, lng], { icon: pixelIcon }).addTo(map);
        map.setView([lat, lng], 17);
      } else {
        // 2回目以降：移動に合わせてドット絵も動くやよ
        userMarker.setLatLng([lat, lng]);
      }
    }, (error) => {
      alert('GPSの位置情報が取れんかったやよ…スマホの設定で位置情報を許可してね！');
    }, {
      enableHighAccuracy: true
    });
  } else {
    alert('このブラウザはGPSに対応してないやよ〜！');
  }
</script>
</body>
</html>
