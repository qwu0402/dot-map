<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ドット絵マップやよ！</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; width: 100vw; margin: 0; }
    body { margin: 0; padding: 0; }
    .pixel-art { image-rendering: pixelated; }
  </style>
</head>
<body>

<div id="map"></div>

<script>
  // 地図の表示（北見駅の近くを中心にしておくやよ！）
  const map = L.map('map').setView([43.8041, 143.8964], 16);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap'
  }).addTo(map);

  // 分かりやすいサンプルアイコン画像（赤いピンじゃなくてドット絵風アイコン）やよ！
  const pixelIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34]
  });

  // テスト用に固定位置にドット絵マーカーを置くやよ！
  const testMarker = L.marker([43.8041, 143.8964], { icon: pixelIcon }).addTo(map);
  testMarker.bindPopup("ここにドット絵がいるやよ！").openPopup();

  // GPS追跡も動かすやよ！
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition((position) => {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      
      // 現在地にもマーカーを置くやよ！
      L.marker([lat, lng], { icon: pixelIcon }).addTo(map);
      map.setView([lat, lng], 16);
    }, (error) => {
      console.log('GPSエラーやよ');
    }, { enableHighAccuracy: true });
  }
</script>
</body>
</html>
